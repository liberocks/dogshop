apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: dogshop
  namespace: datadog
  labels:
    app.kubernetes.io/part-of: dogshop
spec:
  global:
    clusterName: dogshop-minikube
    site: ${DD_SITE}
    kubelet:
      tlsVerify: false
    credentials:
      apiSecret:
        secretName: dogshop-datadog
        keyName: api-key
      appSecret:
        secretName: dogshop-datadog
        keyName: app-key
    tags:
      - env:${DD_ENV}
      - project:dogshop
  features:
    admissionController:
      enabled: true
      agentCommunicationMode: service
    apm:
      enabled: true
      unixDomainSocketConfig:
        enabled: true
    dogstatsd:
      nonLocalTraffic: true
      unixDomainSocketConfig:
        enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    liveProcessCollection:
      enabled: true
    orchestratorExplorer:
      enabled: true
    clusterChecks:
      enabled: true
  override:
    nodeAgent:
      env:
        - name: DD_CLOUD_PROVIDER_METADATA
          value: "[]"
      containers:
        agent:
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
    clusterAgent:
      containers:
        cluster-agent:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
