# Demo-only application credential. Datadog and RUM credentials are created
# from .env by scripts/dogshop.sh and are never stored in this repository.
apiVersion: v1
kind: Secret
metadata:
  name: dogshop-secrets
  labels:
    app.kubernetes.io/name: dogshop
    app.kubernetes.io/part-of: dogshop
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres
