apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dogshop
spec:
  # The frontend and proxy call each other during startup, before either root
  # probe can succeed. Keep their internal endpoints available for that phase.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: dogshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: dogshop
        tags.datadoghq.com/service: dogshop-frontend
        tags.datadoghq.com/env: ${DD_ENV}
        tags.datadoghq.com/version: ${DD_VERSION}
      annotations:
        ad.datadoghq.com/frontend.logs: '[{"source":"nodejs","service":"dogshop-frontend","auto_multi_line_detection":true}]'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: wait-for-backend
          image: busybox:1.37.0
          command: [sh, -c, 'until nc -z backend 4000; do echo waiting for backend; sleep 2; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: frontend
          image: ghcr.io/datadog/storedog/frontend@sha256:427dee692fe7d06152951d5a5ccccf4f687f0f6e084d46bc49ac78eeb6f5dee3
          imagePullPolicy: IfNotPresent
          command: [npm, run, prod]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_ADS_ROUTE
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_ADS_ROUTE}}
            - name: NEXT_PUBLIC_DISCOUNTS_ROUTE
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_DISCOUNTS_ROUTE}}
            - name: NEXT_PUBLIC_DBM_ROUTE
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_DBM_ROUTE}}
            - name: NEXT_PUBLIC_FRONTEND_API_ROUTE
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_FRONTEND_API_ROUTE}}
            - name: NEXT_PUBLIC_SPREE_API_HOST
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_SPREE_API_HOST}}
            - name: NEXT_PUBLIC_SPREE_CLIENT_HOST
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_SPREE_CLIENT_HOST}}
            - name: NEXT_PUBLIC_SPREE_IMAGE_HOST
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_SPREE_IMAGE_HOST}}
            - name: NEXT_PUBLIC_SPREE_ALLOWED_IMAGE_DOMAIN
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: NEXT_PUBLIC_SPREE_ALLOWED_IMAGE_DOMAIN}}
            - name: NEXT_PUBLIC_DD_APPLICATION_ID
              valueFrom: {secretKeyRef: {name: dogshop-rum, key: application-id}}
            - name: NEXT_PUBLIC_DD_CLIENT_TOKEN
              valueFrom: {secretKeyRef: {name: dogshop-rum, key: client-token}}
            - name: NEXT_PUBLIC_DD_SITE
              valueFrom: {configMapKeyRef: {name: dogshop-runtime, key: DD_SITE}}
            - name: NEXT_PUBLIC_DD_ENV
              valueFrom: {configMapKeyRef: {name: dogshop-runtime, key: DD_ENV}}
            - name: NEXT_PUBLIC_DD_VERSION_FRONTEND
              valueFrom: {configMapKeyRef: {name: dogshop-runtime, key: DD_VERSION}}
            - name: NEXT_PUBLIC_DD_SERVICE_FRONTEND
              value: dogshop-frontend
            - name: DD_ENV
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/env']"}}
            - name: DD_SERVICE
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/service']"}}
            - name: DD_VERSION
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/version']"}}
            - name: DD_AGENT_HOST
              value: dogshop-agent.datadog.svc
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
          resources:
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: 500m, memory: 1Gi}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
