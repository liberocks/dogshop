  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dogshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: dogshop
        tags.datadoghq.com/service: dogshop-backend
        tags.datadoghq.com/env: ${DD_ENV}
        tags.datadoghq.com/version: ${DD_VERSION}
      annotations:
        ad.datadoghq.com/backend.logs: '[{"source":"ruby","service":"dogshop-backend","auto_multi_line_detection":true}]'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -c, 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
      containers:
        - name: backend
          image: ghcr.io/datadog/storedog/backend@sha256:1f4eaef99404ea87a1f294d0ef88692a3a111a0000a2d2279fb8727cd39d9af6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: REDIS_URL
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: REDIS_URL}}
            - name: DB_HOST
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: DB_HOST}}
            - name: DB_PORT
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: DB_PORT}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: dogshop-secrets, key: POSTGRES_PASSWORD}}
            - name: RAILS_ENV
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: RAILS_ENV}}
            - name: DB_POOL
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: DB_POOL}}
            - name: MAX_THREADS
              valueFrom: {configMapKeyRef: {name: dogshop-config, key: MAX_THREADS}}
            - name: DD_ENV
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/env']"}}
            - name: DD_SERVICE
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/service']"}}
            - name: DD_VERSION
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['tags.datadoghq.com/version']"}}
            - name: DD_AGENT_HOST
              value: dogshop-agent.datadog.svc
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_PROFILING_ENABLED
              value: "true"
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
---
