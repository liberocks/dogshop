---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  labels:
    app.kubernetes.io/name: traffic
    app.kubernetes.io/component: traffic-generator
    app.kubernetes.io/part-of: dogshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic
        app.kubernetes.io/component: traffic-generator
        app.kubernetes.io/part-of: dogshop
        tags.datadoghq.com/service: dogshop-traffic
        tags.datadoghq.com/env: ${DD_ENV}
        tags.datadoghq.com/version: ${DD_VERSION}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: puppeteer
          image: ghcr.io/datadog/storedog/puppeteer@sha256:7d44e541d78f245e4ff480ce335912b4dd6c8dc16f2fcc69f4029cddd420543d
          imagePullPolicy: IfNotPresent
          env:
            - name: STOREDOG_URL
              value: http://service-proxy.dogshop.svc.cluster.local
            - name: PUPPETEER_TIMEOUT
              value: "30000"
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            capabilities:
              add: [SYS_ADMIN]
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
