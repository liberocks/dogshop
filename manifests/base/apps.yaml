apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dogshop
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: dogshop
    tags.datadoghq.com/service: dogshop-db
    tags.datadoghq.com/env: ${DD_ENV}
    tags.datadoghq.com/version: ${DD_VERSION}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: dogshop
        tags.datadoghq.com/service: dogshop-db
        tags.datadoghq.com/env: ${DD_ENV}
        tags.datadoghq.com/version: ${DD_VERSION}
      annotations:
        ad.datadoghq.com/postgres.logs: '[{"source":"postgresql","service":"dogshop-db","auto_multi_line_detection":true}]'
        ad.datadoghq.com/postgres.checks: '{"postgres":{"init_config":{},"instances":[{"host":"%%host%%","port":5432,"username":"datadog","password":"datadog"}]}}'
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: postgres
          image: ghcr.io/datadog/storedog/postgres@sha256:4909566c7717f87583227df4875e0fe650042d2a024a86028e01067bace80bb6
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dogshop-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dogshop-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 3Gi
---
