apiVersion: v1
kind: ServiceAccount
metadata:
  name: dogshop-mcp
  labels:
    app.kubernetes.io/name: dogshop-mcp
    app.kubernetes.io/part-of: dogshop
---
# The MCP identity may inspect the cluster but cannot read credentials or
# mutate resources outside the dogshop namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dogshop-mcp-observer
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "events", "pods", "pods/log", "pods/status", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dogshop-mcp-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dogshop-mcp-observer
subjects:
  - kind: ServiceAccount
    name: dogshop-mcp
    namespace: dogshop
---
# Keep mutations constrained to the demo namespace. Secrets and all RBAC
# resources are deliberately absent from this role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dogshop-mcp-editor
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dogshop-mcp-editor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dogshop-mcp-editor
subjects:
  - kind: ServiceAccount
    name: dogshop-mcp
    namespace: dogshop
