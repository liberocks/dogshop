# The service deliberately selects no pods. Applying this overlay makes the
# storefront's ads request fail while the ads Deployment remains healthy.
apiVersion: v1
kind: Service
metadata:
  name: ads
  namespace: dogshop
spec:
  selector:
    app.kubernetes.io/name: ads-broken
  ports:
    - name: http
      port: 3030
      targetPort: http
